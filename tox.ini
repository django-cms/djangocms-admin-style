[tox]
envlist =
    ruff
    docker
    py{37,38}-dj{22}-cms{37,38}
    py{37,38,39,310}-dj{31}-cms{38,39}

skip_missing_interpreters=True

[bdist_wheel]
universal=1

[testenv]
deps =
    -r{toxinidir}/tests/requirements/base.txt
    dj22: Django>=2.2,<3.0
    dj31: Django>=3.1,<3.2
    cms37: django-cms>=3.7,<3.8
    cms38: django-cms>=3.8,<3.9
    cms39: django-cms>=3.9,<3.10
commands =
    {envpython} --version
    {env:COMMAND:coverage} erase
    {env:COMMAND:coverage} run tests/settings.py
    {env:COMMAND:coverage} report

[testenv:docker22]
commands = make test VERSION=2.2

[testenv:docker31]
commands = make test VERSION=3.1

[testenv:ruff]
deps = ruff
commands = ruff check
skip_install = true
